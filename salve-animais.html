<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>A Arca de Noé - Corrida dos Animais</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none; /* Evita selecionar texto ao tocar rapidamente nos botões */
      -webkit-user-select: none;
    }
    body {
      background-color: #0b131e;
      color: #f5f0eb;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    h1 {
      font-size: 1.3rem;
      margin-bottom: 8px;
      text-align: center;
      color: #ff8c42;
    }
    #game-container {
      position: relative;
      border: 3px solid #ff8c42;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      max-width: 100%;
    }
    canvas {
      background: linear-gradient(to bottom, #0f1c2e 0%, #172a45 70%, #0d1b2a 100%);
      display: block;
      /* Mantém o aspeto proporcional no ecrã do telemóvel */
      max-width: 100%;
      height: auto;
    }
    /* Controlo de Botões no Ecrã */
    .controls {
      display: flex;
      justify-content: space-between;
      width: 320px; /* Mesma largura do canvas */
      max-width: 100%;
      margin-top: 12px;
      gap: 12px;
    }
    .btn-control {
      flex: 1;
      padding: 16px 0;
      background-color: #172a45;
      color: #ff8c42;
      border: 2px solid #ff8c42;
      border-radius: 8px;
      font-size: 1.5rem;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-control:active {
      background-color: #ff8c42;
      color: #0b131e;
    }
  </style>
</head>
<body>

  <h1>A Arca de Noé</h1>
  
  <div id="game-container">
    <!-- Reduzido para 320px de largura e aumentado para 520px de altura -->
    <canvas id="gameCanvas" width="320" height="520"></canvas>
  </div>

  <!-- Botões visíveis para telemóvel -->
  <div class="controls">
    <div class="btn-control" id="btnLeft">◀</div>
    <div class="btn-control" id="btnRight">▶</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Web Audio API
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'catch') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      } else if (type === 'gameover') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.setValueAtTime(200, now + 0.15);
        osc.frequency.setValueAtTime(100, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      }
    }

    // Estado do Jogo
    let score = 0;
    let lives = 5; 
    let gameOver = false;
    let frameCount = 0;

    let highScore = localStorage.getItem('arca_highscore') || 0;

    // A Arca (ajustada para a nova largura)
    const ark = {
      x: canvas.width / 2 - 35,
      y: canvas.height - 50,
      width: 70,
      height: 32,
      speed: 6
    };

    const items = [];
    const animalEmojis = ['🦁', '🐘', '🦒', '🦓', '🐑', '🕊️'];
    const hazardEmoji = '🌩️';

    const keys = { right: false, left: false };

    // Controlos por Teclado
    document.addEventListener('keydown', (e) => {
      initAudio();
      if (e.key === 'ArrowRight' || e.key === 'Right') keys.right = true;
      if (e.key === 'ArrowLeft' || e.key === 'Left') keys.left = true;
      if (gameOver && e.code === 'Space') restartGame();
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Right') keys.right = false;
      if (e.key === 'ArrowLeft' || e.key === 'Left') keys.left = false;
    });

    // Controlos pelos Botões do Ecrã
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');

    const handlePressLeft = (e) => { e.preventDefault(); initAudio(); if(gameOver) restartGame(); keys.left = true; };
    const handleReleaseLeft = (e) => { e.preventDefault(); keys.left = false; };
    const handlePressRight = (e) => { e.preventDefault(); initAudio(); if(gameOver) restartGame(); keys.right = true; };
    const handleReleaseRight = (e) => { e.preventDefault(); keys.right = false; };

    btnLeft.addEventListener('touchstart', handlePressLeft);
    btnLeft.addEventListener('touchend', handleReleaseLeft);
    btnLeft.addEventListener('mousedown', handlePressLeft);
    btnLeft.addEventListener('mouseup', handleReleaseLeft);

    btnRight.addEventListener('touchstart', handlePressRight);
    btnRight.addEventListener('touchend', handleReleaseRight);
    btnRight.addEventListener('mousedown', handlePressRight);
    btnRight.addEventListener('mouseup', handleReleaseRight);

    // Reiniciar ao tocar no ecrã de game over
    canvas.addEventListener('touchstart', () => {
      initAudio();
      if (gameOver) restartGame();
    });

    function spawnItem() {
      const isHazard = Math.random() < 0.20;
      const emoji = isHazard 
        ? hazardEmoji 
        : animalEmojis[Math.floor(Math.random() * animalEmojis.length)];

      items.push({
        x: Math.random() * (canvas.width - 28),
        y: -30,
        size: 26,
        speed: 1.5 + Math.random() * 1 + (score * 0.02),
        isHazard: isHazard,
        emoji: emoji
      });
    }

    function triggerGameOver() {
      gameOver = true;
      playSound('gameover');

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('arca_highscore', highScore);
      }
    }

    function update() {
      if (gameOver) return;

      if (keys.right && ark.x + ark.width < canvas.width) {
        ark.x += ark.speed;
      }
      if (keys.left && ark.x > 0) {
        ark.x -= ark.speed;
      }

      frameCount++;
      if (frameCount % 60 === 0) {
        spawnItem();
      }

      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.y += item.speed;

        if (
          item.x < ark.x + ark.width &&
          item.x + item.size > ark.x &&
          item.y < ark.y + ark.height &&
          item.y + item.size > ark.y
        ) {
          if (item.isHazard) {
            lives--;
            playSound('hit');
            if (lives <= 0) triggerGameOver();
          } else {
            score += 10;
            playSound('catch');
          }
          items.splice(i, 1);
          continue;
        }

        if (item.y > canvas.height) {
          if (!item.isHazard) {
            score = Math.max(0, score - 5);
          }
          items.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Desenhar Arca
      ctx.fillStyle = '#d97724';
      ctx.beginPath();
      ctx.moveTo(ark.x, ark.y);
      ctx.lineTo(ark.x + ark.width, ark.y);
      ctx.lineTo(ark.x + ark.width - 8, ark.y + ark.height);
      ctx.lineTo(ark.x + 8, ark.y + ark.height);
      ctx.closePath();
      ctx.fill();

      // Casinha da Arca
      ctx.fillStyle = '#ff8c42';
      ctx.fillRect(ark.x + 18, ark.y - 10, ark.width - 36, 10);

      // Desenhar Emojis
      ctx.font = '22px serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      items.forEach(item => {
        ctx.fillText(item.emoji, item.x, item.y);
      });

      // Interface Superior
      ctx.fillStyle = '#f5f0eb';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText(`Pts: ${score}`, 10, 15);
      ctx.fillText(`${'❤️'.repeat(Math.max(0, lives))}`, canvas.width - 110, 15);

      // Ecrã de Game Over
      if (gameOver) {
        ctx.fillStyle = 'rgba(11, 19, 30, 0.9)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff8c42';
        ctx.textAlign = 'center';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText('Fim de Jogo!', canvas.width / 2, canvas.height / 2 - 40);

        ctx.fillStyle = '#f5f0eb';
        ctx.font = '16px sans-serif';
        ctx.fillText(`Pontuação final: ${score}`, canvas.width / 2, canvas.height / 2 - 5);
        
        ctx.fillStyle = '#ffaa5b';
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText(`🏆 Recorde: ${highScore}`, canvas.width / 2, canvas.height / 2 + 25);

        ctx.font = '13px sans-serif';
        ctx.fillStyle = '#f5f0eb';
        ctx.fillText('Toca num botão para recomeçar', canvas.width / 2, canvas.height / 2 + 65);
      }
    }

    function restartGame() {
      score = 0;
      lives = 5;
      gameOver = false;
      items.length = 0;
      frameCount = 0;
      ark.x = canvas.width / 2 - 35;
      gameLoop();
    }

    function gameLoop() {
      update();
      draw();
      if (!gameOver) {
        requestAnimationFrame(gameLoop);
      }
    }

    gameLoop();
  </script>
</body>
</html>
