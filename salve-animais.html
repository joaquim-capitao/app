<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Arca de Noé - Salva os animais</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b131e;
      color: #f5f0eb;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      text-align: center;
      color: #ff8c42;
    }
    #game-container {
      position: relative;
      border: 4px solid #ff8c42;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
    }
    canvas {
      background: linear-gradient(to bottom, #0f1c2e 0%, #172a45 70%, #0d1b2a 100%);
      display: block;
    }
    .instructions {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #f5f0eb;
      text-align: center;
    }
    .instructions strong {
      color: #ff8c42;
    }
  </style>
</head>
<body>

  <h1>A Arca de Noé: Salva os Animais</h1>
  
  <div id="game-container">
    <canvas id="gameCanvas" width="400" height="500"></canvas>
  </div>

  <p class="instructions">
    Usa as setas <strong>Esquerda / Direita</strong> (ou toca nos lados do ecrã) para mover a Arca.
  </p>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Web Audio API para efeitos sonoros
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'catch') {
        // Som agudo e rápido ao apanhar animal
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.1); // A5
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'hit') {
        // Som grave de impacto ao atingir tempestade
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      } else if (type === 'gameover') {
        // Melodia descendente no Game Over
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.setValueAtTime(200, now + 0.15);
        osc.frequency.setValueAtTime(100, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      }
    }

    // Estado do Jogo
    let score = 0;
    let lives = 5; 
    let gameOver = false;
    let frameCount = 0;

    // Carregar o Recorde Guardado
    let highScore = localStorage.getItem('arca_highscore') || 0;

    // A Arca
    const ark = {
      x: canvas.width / 2 - 40,
      y: canvas.height - 50,
      width: 80,
      height: 35,
      speed: 7
    };

    // Lista de Objetos
    const items = [];
    const animalEmojis = ['🦁', '🐘', '🦒', '🦓', '🐑', '🕊️'];
    const hazardEmoji = '🌩️';

    // Teclas
    const keys = { right: false, left: false };

    document.addEventListener('keydown', (e) => {
      initAudio();
      if (e.key === 'ArrowRight' || e.key === 'Right') keys.right = true;
      if (e.key === 'ArrowLeft' || e.key === 'Left') keys.left = true;
      if (gameOver && e.code === 'Space') restartGame();
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Right') keys.right = false;
      if (e.key === 'ArrowLeft' || e.key === 'Left') keys.left = false;
    });

    // Suporte para Ecrã Tátil
    canvas.addEventListener('touchstart', (e) => {
      initAudio();
      if (gameOver) {
        restartGame();
        return;
      }
      const touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
      if (touchX < canvas.width / 2) {
        keys.left = true;
        keys.right = false;
      } else {
        keys.right = true;
        keys.left = false;
      }
    });

    canvas.addEventListener('touchend', () => {
      keys.left = false;
      keys.right = false;
    });

    function spawnItem() {
      const isHazard = Math.random() < 0.20;
      const emoji = isHazard 
        ? hazardEmoji 
        : animalEmojis[Math.floor(Math.random() * animalEmojis.length)];

      items.push({
        x: Math.random() * (canvas.width - 30),
        y: -30,
        size: 28,
        speed: 1.5 + Math.random() * 1 + (score * 0.02),
        isHazard: isHazard,
        emoji: emoji
      });
    }

    function triggerGameOver() {
      gameOver = true;
      playSound('gameover');

      // Guardar Recorde
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('arca_highscore', highScore);
      }
    }

    function update() {
      if (gameOver) return;

      if (keys.right && ark.x + ark.width < canvas.width) {
        ark.x += ark.speed;
      }
      if (keys.left && ark.x > 0) {
        ark.x -= ark.speed;
      }

      frameCount++;
      if (frameCount % 60 === 0) {
        spawnItem();
      }

      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.y += item.speed;

        // Colisão
        if (
          item.x < ark.x + ark.width &&
          item.x + item.size > ark.x &&
          item.y < ark.y + ark.height &&
          item.y + item.size > ark.y
        ) {
          if (item.isHazard) {
            lives--;
            playSound('hit');
            if (lives <= 0) triggerGameOver();
          } else {
            score += 10;
            playSound('catch');
          }
          items.splice(i, 1);
          continue;
        }

        // Remover ao sair do ecrã
        if (item.y > canvas.height) {
          if (!item.isHazard) {
            score = Math.max(0, score - 5);
          }
          items.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Desenhar Arca
      ctx.fillStyle = '#d97724';
      ctx.beginPath();
      ctx.moveTo(ark.x, ark.y);
      ctx.lineTo(ark.x + ark.width, ark.y);
      ctx.lineTo(ark.x + ark.width - 10, ark.y + ark.height);
      ctx.lineTo(ark.x + 10, ark.y + ark.height);
      ctx.closePath();
      ctx.fill();

      // Casinha da Arca
      ctx.fillStyle = '#ff8c42';
      ctx.fillRect(ark.x + 20, ark.y - 12, ark.width - 40, 12);

      // Desenhar Emojis
      ctx.font = '24px serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      items.forEach(item => {
        ctx.fillText(item.emoji, item.x, item.y);
      });

      // Interface Superior
      ctx.fillStyle = '#f5f0eb';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText(`Pontos: ${score}`, 15, 20);
      ctx.fillText(`Vidas: ${'❤️'.repeat(Math.max(0, lives))}`, canvas.width - 135, 20);

      // Ecrã de Game Over
      if (gameOver) {
        ctx.fillStyle = 'rgba(11, 19, 30, 0.9)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff8c42';
        ctx.textAlign = 'center';
        ctx.font = 'bold 26px sans-serif';
        ctx.fillText('Fim de Jogo!', canvas.width / 2, canvas.height / 2 - 50);

        ctx.fillStyle = '#f5f0eb';
        ctx.font = '18px sans-serif';
        ctx.fillText(`Pontuação final: ${score}`, canvas.width / 2, canvas.height / 2 - 10);
        
        ctx.fillStyle = '#ffaa5b';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(`🏆 Recorde Pessoal: ${highScore}`, canvas.width / 2, canvas.height / 2 + 25);

        ctx.font = '14px sans-serif';
        ctx.fillStyle = '#f5f0eb';
        ctx.fillText('Pressiona ESPAÇO ou TOQUE para recomeçar', canvas.width / 2, canvas.height / 2 + 65);
      }
    }

    function restartGame() {
      score = 0;
      lives = 5;
      gameOver = false;
      items.length = 0;
      frameCount = 0;
      ark.x = canvas.width / 2 - 40;
      gameLoop();
    }

    function gameLoop() {
      update();
      draw();
      if (!gameOver) {
        requestAnimationFrame(gameLoop);
      }
    }

    gameLoop();
  </script>
</body>
</html>
