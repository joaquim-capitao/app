<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quem disse?</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: #1f1f2e;
      color: #e4e6eb;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #1f1f2e;
      padding: 32px;
      border-radius: 16px;
      border: 1px solid #33334d;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    .header {
      margin-bottom: 24px;
    }

    .title {
      font-size: 1.6rem;
      color: #ff6633;
      margin-bottom: 8px;
    }

    .score-board {
      font-size: 0.95rem;
      color: #b0b3b8;
      font-weight: 600;
    }

    .quote-box {
      background: #191926;
      border: 1px solid #33334d;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 24px;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quote-text {
      font-size: 1.15rem;
      font-style: italic;
      color: #e4e6eb;
      line-height: 1.4;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    button.option-btn {
      background: #191926;
      border: 1px solid #33334d;
      border-radius: 10px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 500;
      color: #7171e0;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button.option-btn:hover:not(:disabled) {
      background: #1f1f2e;
      border-color: #33334d;
    }

    button.option-btn:disabled {
      cursor: default;
    }

    button.option-btn.correct {
      background: #dcfce7;
      border-color: #22c55e;
      color: #15803d;
      font-weight: 600;
    }

    button.option-btn.wrong {
      background: #fee2e2;
      border-color: #ef4444;
      color: #b91c1c;
    }

    .feedback {
      min-height: 24px;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .next-btn {
      background: #ff6633;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .next-btn:hover {
      background: #e65c2e;
    }

    .hide {
      display: none;
    }

    /* Rodapé */
    .footer {
      margin-top: 32px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .footer-date {
      color: #8f9ba8;
      font-size: 0.95rem;
    }

    .footer-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #25283d;
      color: #5d75d6;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: background 0.2s, border-color 0.2s;
    }

    .footer-btn:hover {
      background: #2e324c;
      border-color: #3b3f5c;
    }

    .footer-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
  </style>
</head>

    <div class="quote-box">
      <p class="quote-text" id="quote">Carregando...</p>

    <div class="options-grid" id="options"></div>

    <div class="feedback" id="feedback"></div>

    <button id="next-btn" class="next-btn hide" onclick="nextQuestion()">Próxima Frase</button>

      { text: "Pode sair algo de bom de Nazaré?", author: "Natanael" },
      { text: "Senhor, a esta altura ele já deve cheirar mal, pois já faz quatro dias.", author: "Marta" },
      { text: "Vós não sabeis nada, nem pensais que é para vosso benefício que um só homem morra a favor do povo, e não que toda a nação seja destruída.", author: "Caifás" },
      { text: "Se este homem não fosse de Deus, nada poderia fazer.", author: "O ex-cego de nascença" },
      { text: "Diz-me, por favor, de quem fala o profeta? De si mesmo ou de outro homem?", author: "O eunuco etíope" },
      { text: "Não vos metais com estes homens; deixai-os em paz. Porque, se este plano ou esta obra for de homens, será derrubada; mas, se for de Deus, vós não podereis derrubá-los.", author: "Gamaliel" },
      { text: "Em pouco tempo convencer-me-ias a tornar-me cristão.", author: "Rei Herodes Agripa II" },
      { text: "Não fará o Juiz de toda a terra o que é justo?", author: "Abraão" }
    ];

    const allAuthors = [...new Set(database.map(item => item.author))];

    let currentQuestion = 0;
    let score = 0;
    let mistakes = 0;
    let shuffledDeck = [];

    function shuffle(array) {
      return array.slice().sort(() => Math.random() - 0.5);
    }

    function initGame(continuePlaying = false) {
      if (!continuePlaying) {
        shuffledDeck = shuffle(database);
        currentQuestion = 0;
        score = 0;
        mistakes = 0;
      }
      loadQuestion();
    }

    function generateOptions(correctAuthor) {
      const distractors = shuffle(allAuthors.filter(name => name !== correctAuthor)).slice(0, 2);
      return shuffle([correctAuthor, ...distractors]);
    }

    function loadQuestion() {
      const q = shuffledDeck[currentQuestion];
      document.getElementById("quote").innerText = `"${q.text}"`;
      document.getElementById("feedback").innerText = "";
      
      const nextBtn = document.getElementById("next-btn");
      nextBtn.classList.add("hide");
      nextBtn.innerText = "Próxima Frase";
      nextBtn.onclick = nextQuestion;

      document.getElementById("score").innerText = score;
      document.getElementById("total").innerText = currentQuestion;

      const options = generateOptions(q.author);
      const container = document.getElementById("options");
      container.innerHTML = "";

      options.forEach(authorName => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = authorName;
        btn.onclick = () => selectOption(btn, authorName, q.author);
        container.appendChild(btn);
      });
    }

    function selectOption(selectedBtn, chosenAuthor, correctAuthor) {
      const buttons = document.querySelectorAll(".option-btn");
      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.innerText === correctAuthor) {
          btn.classList.add("correct");
        }
      });

      const feedback = document.getElementById("feedback");
      if (chosenAuthor === correctAuthor) {
        score++;
        feedback.style.color = "#15803d";
        feedback.innerText = "Correto!";
      } else {
        mistakes++;
        selectedBtn.classList.add("wrong");
        feedback.style.color = "#b91c1c";
        feedback.innerText = `Incorreto. A resposta certa era ${correctAuthor}.`;
      }

      document.getElementById("score").innerText = score;
      document.getElementById("total").innerText = currentQuestion + 1;

      // Se falhar 3 vezes, termina imediatamente
      if (mistakes >= 3) {
        endGame("Falhaste 3 vezes. É bom ler a Bíblia de vez em quando!", "Voltar a Jogar", () => initGame(false));
        return;
      }

      // Se chegar às 50 perguntas
      if (currentQuestion + 1 === 50) {
        if (mistakes === 0) {
          endGame("Parabéns! Conseguiste acertar 50 perguntas seguidas! Vê-se que andas a ler a Bíblia.", "Continuar a Jogar", () => {
            currentQuestion++;
            loadQuestion();
          });
        } else {
          endGame("Não conseguiste acertar em todas as perguntas. Tens de melhorar esses hábitos de leitura da Bíblia.", "Voltar a Jogar", () => initGame(false));
        }
        return;
      }

      document.getElementById("next-btn").classList.remove("hide");
    }

    function endGame(message, buttonText, buttonAction) {
      document.getElementById("quote").innerText = message;
      document.getElementById("options").innerHTML = "";
      document.getElementById("feedback").innerText = "";
      
      const nextBtn = document.getElementById("next-btn");
      nextBtn.innerText = buttonText;
      nextBtn.onclick = buttonAction;
      nextBtn.classList.remove("hide");
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < shuffledDeck.length) {
        loadQuestion();
      } else {
        endGame(`Fim de jogo! Acertaste ${score} de ${shuffledDeck.length} frases.`, "Voltar a Jogar", () => initGame(false));
      }
    }

    initGame();
  </script>
</body>
</html>
