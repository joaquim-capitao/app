<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Bíblico</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 25px; }
        
        .progress-text { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
        
        .progress-bar { width: 100%; height: 12px; background-color: var(--border); border-radius: 6px; overflow: hidden; }
        
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--success)); transition: width 0.3s; }

        .question { font-size: 18px; font-weight: bold; margin: 25px 0; line-height: 1.5; min-height: 54px; color: #f97316; }

        .options-list { display: flex; flex-direction: column; gap: 12px; }

        .option-btn {
            background: transparent; color: var(--text-color); border: 2px solid var(--border);
            padding: 15px; border-radius: 10px; cursor: pointer; font-size: 16px; text-align: left; transition: all 0.2s;
        }

        .option-btn:hover:not(:disabled) { border-color: var(--primary); background: rgba(99, 102, 241, 0.05); }

        .option-btn.correct { background-color: rgba(16, 185, 129, 0.15) !important; border-color: var(--success) !important; color: #34d399; }
        
        .option-btn.wrong { background-color: rgba(239, 68, 68, 0.15) !important; border-color: var(--danger) !important; color: #f87171; }

        .screen { display: none; }
        .screen.active { display: block; }

        .btn-action {
            background: var(--primary); color: white; border: none; padding: 14px 28px;
            border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 25px;
        }
        .btn-action:hover { background: var(--primary-hover); }

        /* Rodapé com atualização e link */
        .footer-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .app-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 6px;
            background: rgba(99, 102, 241, 0.1);
            transition: all 0.2s ease;
        }

        .app-link:hover {
            background: rgba(99, 102, 241, 0.2);
            color: var(--text-color);
        }

        .app-link svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ECRÃ DO JOGO -->
        <div id="game-screen" class="screen active">
            <h1 style="color: #f97316;">Quiz Bíblico</h1>
            <p class="subtitle">Responde a 50 perguntas com um máximo de 2 erros permitidos.</p>
            
            <div class="progress-text">
                <span id="streak-label">Pergunta: 1 / 50</span>
                <span id="errors-label" style="color: #f87171;">Erros: 0 / 3</span>
            </div>
            <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>

            <div class="question" id="question-text">A carregar...</div>
            <div class="options-list">
                <button class="option-btn" onclick="checkAnswer(0)"></button>
                <button class="option-btn" onclick="checkAnswer(1)"></button>
                <button class="option-btn" onclick="checkAnswer(2)"></button>
            </div>
        </div>

        <!-- ECRÃ DE RESULTADO / FIM DE JOGO -->
        <div id="result-screen" class="screen">
            <h1 id="result-title" style="margin-bottom: 15px;"></h1>
            <p id="result-msg" style="margin-top: 15px; font-size: 18px; line-height: 1.5;"></p>
            <button id="result-btn" class="btn-action" onclick="restartGame()">Voltar a Jogar</button>
        </div>

        <!-- RODAPÉ COM ATUALIZAÇÃO E LINK -->
        <div class="footer-info">
            <span>Última atualização: 26 de agosto de 2026</span>
            <a href="https://joaquim-capitao.github.io/app/index" class="app-link" target="_blank" rel="noopener noreferrer">

    </div>

        let perguntasDoJogo = [];
        let indiceAtual = 0;
        let errosCometidos = 0;
        let aceitandoRespostas = true;

        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const resultTitle = document.getElementById('result-title');
        const resultMsg = document.getElementById('result-msg');
        const resultBtn = document.getElementById('result-btn');

        const questionText = document.getElementById('question-text');
        const optionButtons = document.querySelectorAll('.option-btn');
        const streakLabel = document.getElementById('streak-label');
        const errorsLabel = document.getElementById('errors-label');
        const progressFill = document.getElementById('progress-fill');

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initRound() {
            if (typeof poolDePerguntas === 'undefined' || poolDePerguntas.length === 0) {
                questionText.innerText = "Erro ao carregar as perguntas do jogo.";
                return;
            }
            const emba = shuffle([...poolDePerguntas]);
            perguntasDoJogo = emba.slice(0, 50);
            indiceAtual = 0;
            errosCometidos = 0;
            aceitandoRespostas = true;
            updateUI();
        }

        function updateUI() {
            streakLabel.innerText = `Pergunta: ${indiceAtual + 1} / 50`;
            errorsLabel.innerText = `Erros: ${errosCometidos} / 3`;
            progressFill.style.width = `${(indiceAtual / 50) * 100}%`;
            optionButtons.forEach(btn => { btn.className = 'option-btn'; btn.disabled = false; });

            const p = perguntasDoJogo[indiceAtual];
            questionText.innerText = p.q;
            optionButtons[0].innerText = p.o[0];
            optionButtons[1].innerText = p.o[1];
            optionButtons[2].innerText = p.o[2];
        }

        function checkAnswer(chosenIndex) {
            if (!aceitandoRespostas) return;
            aceitandoRespostas = false;
            const p = perguntasDoJogo[indiceAtual];
            optionButtons.forEach(btn => btn.disabled = true);

            const acertou = (chosenIndex === p.c);

            if (acertou) {
                optionButtons[chosenIndex].classList.add('correct');
            } else {
                optionButtons[chosenIndex].classList.add('wrong');
                optionButtons[p.c].classList.add('correct');
                errosCometidos++;
            }

            setTimeout(() => {
                // Condição 1: 3 erros atingidos
                if (errosCometidos >= 3) {
                    showFinalScreen(
                        "Fim do Jogo!",
                        "Falhaste 3 vezes. É bom ler a Bíblia de vez em quando!",
                        "var(--danger)",
                        "Voltar a Jogar"
                    );
                    return;
                }

                indiceAtual++;

                // Condição 2: Chegou ao fim das 50 perguntas
                if (indiceAtual >= 50) {
                    if (errosCometidos === 0) {
                        showFinalScreen(
                            "Parabéns!",
                            "Parabéns! Conseguiste acertar 50 perguntas seguidas! Vê-se que andas a ler a Bíblia.",
                            "var(--success)",
                            "Continuar a Jogar"
                        );
                    } else {
                        showFinalScreen(
                            "Quiz Concluído",
                            "Não conseguiste acertar em todas as perguntas. Tens de melhorar esses hábitos de leitura da Bíblia.",
                            "var(--warning)",
                            "Voltar a Jogar"
                        );
                    }
                } else {
                    aceitandoRespostas = true;
                    updateUI();
                }
            }, acertou ? 600 : 1000);
        }

        function showFinalScreen(title, msg, color, btnText) {
            gameScreen.classList.remove('active');
            resultTitle.innerText = title;
            resultTitle.style.color = color;
            resultMsg.innerText = msg;
            resultBtn.innerText = btnText;
            resultScreen.classList.add('active');
        }

        function restartGame() {
            resultScreen.classList.remove('active');
            gameScreen.classList.add('active');
            initRound();
        }

        window.onload = initRound;
    </script>
