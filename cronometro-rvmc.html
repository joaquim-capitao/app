<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronómetro - Reunião Vida e Ministério</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #3b82f6;
      --accent-tesouros: #0284c7;
      --accent-ministerio: #d97706;
      --accent-vida: #be123c;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
    }

    .section-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      border-left: 6px solid var(--primary);
    }

    .section-tesouros { border-left-color: var(--accent-tesouros); }
    .section-ministerio { border-left-color: var(--accent-ministerio); }
    .section-vida { border-left-color: var(--accent-vida); }

    .section-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .section-tesouros .section-title { color: #38bdf8; }
    .section-ministerio .section-title { color: #fbbf24; }
    .section-vida .section-title { color: #fb7185; }

    .timer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.6);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .timer-row:last-child {
      margin-bottom: 0;
    }

    .timer-info {
      flex: 1 1 180px;
      font-weight: 500;
    }

    .timer-controls-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .input-minutes {
      width: 65px;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      text-align: center;
      font-size: 0.95rem;
    }

    .timer-display {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.25rem;
      font-weight: 700;
      min-width: 75px;
      text-align: center;
    }

    .timer-display.finished {
      color: var(--danger);
      animation: blink 1s infinite alternate;
    }

    @keyframes blink {
      0% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .btn {
      border: none;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.85rem;
    }

    .btn-toggle {
      background-color: var(--primary);
      color: white;
    }

    .btn-toggle.running {
      background-color: #eab308;
      color: #000;
    }

    .btn-reset {
      background-color: #334155;
      color: var(--text-muted);
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    @media (max-width: 540px) {
      .timer-row {
        flex-direction: column;
        align-items: flex-start;
      }
      .timer-controls-group {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Cronómetro para a Reunião Vida e Ministério Cristãos</h1>
    </header>

    <div class="section-card section-tesouros">
      <div class="section-title">Tesouros da Palavra de Deus</div>
      
      <div class="timer-row" data-default="10">
        <div class="timer-info">Discurso</div>
        <div class="timer-controls-group">
          <input type="number" class="input-minutes" value="10" min="1">
          <div class="timer-display">10:00</div>
          <button class="btn btn-toggle">Iniciar</button>
          <button class="btn btn-reset">Reiniciar</button>
        </div>
      </div>

      <div class="timer-row" data-default="10">
        <div class="timer-info">Pérolas</div>
        <div class="timer-controls-group">
          <input type="number" class="input-minutes" value="10" min="1">
          <div class="timer-display">10:00</div>
          <button class="btn btn-toggle">Iniciar</button>
          <button class="btn btn-reset">Reiniciar</button>
        </div>
      </div>

      <div class="timer-row" data-default="4">
        <div class="timer-info">Leitura</div>
        <div class="timer-controls-group">
          <input type="number" class="input-minutes" value="4" min="1">
          <div class="timer-display">04:00</div>
          <button class="btn btn-toggle">Iniciar</button>
          <button class="btn btn-reset">Reiniciar</button>
        </div>
      </div>
    </div>

    <div class="section-card section-ministerio">
      <div class="section-title">Empenhe-se no Ministério</div>
      
      <div class="timer-row" data-default="4">
        <div class="timer-info">Designação 1</div>
        <div class="timer-controls-group">
          <input type="number" class="input-minutes" value="4" min="1">
          <div class="timer-display">04:00</div>
          <button class="btn btn-toggle">Iniciar</button>
          <button class="btn btn-reset">Reiniciar</button>
        </div>
      </div>

      <div class="timer-row" data-default="4">
        <div class="timer-info">Designação 2</div>
        <div class="timer-controls-group">
          <input type="number" class="input-minutes" value="4" min="1">
          <div class="timer-display">04:00</div>
          <button class="btn btn-toggle">Iniciar</button>
          <button class="btn btn-reset">Reiniciar</button>
        </div>
      </div>

      <div class="timer-row" data-default="5">
        <div class="timer-info">Designação 3</div>
        <div class="timer-controls-group">
          <input type="number" class="input-minutes" value="5" min="1">
          <div class="timer-display">05:00</div>
          <button class="btn btn-toggle">Iniciar</button>
          <button class="btn btn-reset">Reiniciar</button>
        </div>
      </div>

      <div class="timer-row" data-default="5">
        <div class="timer-info">Designação 4</div>
        <div class="timer-controls-group">
          <input type="number" class="input-minutes" value="5" min="1">
          <div class="timer-display">05:00</div>
          <button class="btn btn-toggle">Iniciar</button>
          <button class="btn btn-reset">Reiniciar</button>
        </div>
      </div>
    </div>

    <div class="section-card section-vida">
      <div class="section-title">Viver como Cristão</div>
      
      <div class="timer-row" data-default="15">
        <div class="timer-info">Parte 1</div>
        <div class="timer-controls-group">
          <input type="number" class="input-minutes" value="15" min="1">
          <div class="timer-display">15:00</div>
          <button class="btn btn-toggle">Iniciar</button>
          <button class="btn btn-reset">Reiniciar</button>
        </div>
      </div>

      <div class="timer-row" data-default="15">
        <div class="timer-info">Parte 2</div>
        <div class="timer-controls-group">
          <input type="number" class="input-minutes" value="15" min="1">
          <div class="timer-display">15:00</div>
          <button class="btn btn-toggle">Iniciar</button>
          <button class="btn btn-reset">Reiniciar</button>
        </div>
      </div>

      <div class="timer-row" data-default="30">
        <div class="timer-info">Estudo Bíblico</div>
        <div class="timer-controls-group">
          <input type="number" class="input-minutes" value="30" min="1">
          <div class="timer-display">30:00</div>
          <button class="btn btn-toggle">Iniciar</button>
          <button class="btn btn-reset">Reiniciar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function formatTime(seconds) {
      const isNegative = seconds < 0;
      const absSeconds = Math.abs(seconds);
      const mins = Math.floor(absSeconds / 60);
      const secs = absSeconds % 60;
      const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      return isNegative ? `-${formatted}` : formatted;
    }

    document.querySelectorAll('.timer-row').forEach(row => {
      const input = row.querySelector('.input-minutes');
      const display = row.querySelector('.timer-display');
      const toggleBtn = row.querySelector('.btn-toggle');
      const resetBtn = row.querySelector('.btn-reset');

      let totalSeconds = parseInt(input.value, 10) * 60;
      let remainingSeconds = totalSeconds;
      let timerId = null;

      function updateDisplay() {
        display.textContent = formatTime(remainingSeconds);
        if (remainingSeconds <= 0) {
          display.classList.add('finished');
        } else {
          display.classList.remove('finished');
        }
      }

      function stopTimer() {
        clearInterval(timerId);
        timerId = null;
        toggleBtn.textContent = 'Iniciar';
        toggleBtn.classList.remove('running');
        input.disabled = false;
      }

      function startTimer() {
        input.disabled = true;
        toggleBtn.textContent = 'Pausar';
        toggleBtn.classList.add('running');
        
        timerId = setInterval(() => {
          remainingSeconds--;
          updateDisplay();
        }, 1000);
      }

      toggleBtn.addEventListener('click', () => {
        if (timerId) {
          stopTimer();
        } else {
          startTimer();
        }
      });

      resetBtn.addEventListener('click', () => {
        stopTimer();
        const mins = parseInt(input.value, 10) || 0;
        remainingSeconds = mins * 60;
        updateDisplay();
      });

      input.addEventListener('change', () => {
        if (!timerId) {
          const mins = parseInt(input.value, 10) || 0;
          remainingSeconds = mins * 60;
          updateDisplay();
        }
      });

      updateDisplay();
    });
  </script>
</body>
</html>
